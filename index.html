<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LPU Campus Event Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap">
<style>
:root{--bg:#fbf9ff;--sf:#fff;--tx:#1c1926;--mu:#645e77;--ln:#e9e2f8;--ac:#7c5ce0;--ac2:#f1ebfd;--ok:#1f8a4c;--er:#c4321f;--wn:#a86a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15131a;--sf:#1e1b26;--tx:#f1eef7;--mu:#a39cb5;--ln:#35304a;--ac:#8b5cf6;--ac2:#2c2142;--ok:#4ed08a;--er:#ff7a66;--wn:#f0b04a}}
:root[data-theme="dark"]{--bg:#15131a;--sf:#1e1b26;--tx:#f1eef7;--mu:#a39cb5;--ln:#35304a;--ac:#8b5cf6;--ac2:#2c2142;--ok:#4ed08a;--er:#ff7a66;--wn:#f0b04a}
html{color-scheme:light dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Outfit,system-ui,sans-serif}
header{background:linear-gradient(120deg,#eee8ff,#cdbbfa);color:#241449;padding:18px 22px 6px;position:relative;overflow:hidden}
.headtop{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.brandmark{width:58px;height:58px;flex:0 0 58px;border-radius:16px;background:#fff;display:grid;place-items:center;box-shadow:0 5px 18px #3d237522;border:1px solid #fff}
.brandmark img{display:block;width:100%;height:100%;object-fit:contain;padding:5px}
.brandcopy{min-width:0}.brandcopy h1{margin:0;font-size:clamp(1.15rem,3vw,1.65rem);line-height:1.15}.brandcopy p{margin:5px 0 0;opacity:.86;font-size:.9rem}
.headactions{display:flex;gap:8px;align-items:center}.headbtn{border:1px solid #a68cdb;background:#ffffff80;color:#2a1a55;border-radius:10px;padding:9px 11px;font:inherit;cursor:pointer}
nav{max-width:1100px;margin:14px auto 0}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:transparent;border:0;color:#2a1a55;padding:10px 14px;font:inherit;cursor:pointer;border-radius:8px 8px 0 0;white-space:nowrap;opacity:.85}
nav button.on{background:var(--bg);color:var(--tx);opacity:1;font-weight:700}
main{max-width:1000px;margin:0 auto;padding:20px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px 11px;width:100%}
.bar input,.bar select{flex:1 1 150px;width:auto}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:1.1rem}.mu{color:var(--mu);font-size:.9rem}
.tag{display:inline-block;font-size:.78rem;padding:2px 9px;border-radius:99px;background:var(--ac2);color:var(--ac);font-weight:500;margin-right:6px}
.tag.Open,.tag.Confirmed{color:var(--ok)}.tag.Full,.tag.Waitlisted{color:var(--wn)}.tag.Completed,.tag.Cancelled{color:var(--mu)}
.meter{height:6px;background:var(--ln);border-radius:9px;overflow:hidden}.meter i{display:block;height:100%;background:var(--ac)}
.btn{background:#b9a3f5;color:#24123f;border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:500;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--ln)}.btn.d{background:transparent;color:var(--er);border:1px solid var(--er)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat b{display:block;font-size:2rem;color:var(--ac)}
label{display:block;font-size:.88rem;font-weight:500;margin:10px 0 4px}
.err{color:var(--er);font-size:.82rem;min-height:1em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
dialog{border:1px solid var(--ln);border-radius:14px;background:var(--sf);color:var(--tx);width:min(460px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.5)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:11px 18px;border-radius:10px;color:#fff;font-weight:500;display:none;z-index:9;max-width:90vw}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
.brow{display:flex;align-items:center;gap:10px;margin:8px 0}.brow span:first-child{width:90px;font-size:.9rem}.brow .meter{flex:1;height:10px}
h2{margin:0 0 12px;font-size:1.25rem}
main section{margin-bottom:48px}
html{scroll-padding-top:20px;scroll-behavior:smooth}
.eventcard{transition:transform .18s ease,box-shadow .18s ease}.eventcard:hover{transform:translateY(-3px);box-shadow:0 12px 30px #4b327018}
.subdued{opacity:.97}
@media(max-width:600px){.headtop{align-items:flex-start}.headactions{margin-left:auto}.brandmark{width:48px;height:48px;flex-basis:48px}.brandmark img{padding:4px}.headbtn{padding:7px 9px;font-size:.85rem}header{padding:14px 14px 5px}}

</style>
</head>

    <div class="brandcopy"><h1>LPU Campus Event Hub</h1><p>Discover. Participate. Make campus memories.</p></div>
  </div>
  <div class="headactions"><button class="headbtn" onclick="toggleTheme()" aria-label="Toggle theme">☼ Theme</button></div>

<nav id="nav" aria-label="Main navigation"></nav>
</header>
<main id="main"></main>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<script>
const CATS=["Technical","Cultural","Sports","Workshop","Seminar","Career"];
const VENUES=["Main Auditorium","Block 32 Seminar Hall","Block 34 Lab","Sports Ground","Open Air Theatre"];
const PROGS=["B.Tech CSE","B.Tech ECE","B.Tech ME","BCA","MBA","B.Sc","Other"];
const TABS=[["events","Events"],["mine","My registrations"],["org","Organizer"],["dash","Dashboard"]];
const day=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const today=day(0);
const seed=[
{id:1,title:"CodeStorm Hackathon",cat:"Technical",date:day(6),time:"09:00",venue:"Block 32 Seminar Hall",cap:3,desc:"24-hour team hackathon with prizes."},
{id:2,title:"Rang Cultural Night",cat:"Cultural",date:day(10),time:"18:00",venue:"Open Air Theatre",cap:200,desc:"Music, dance and drama by student clubs."},
{id:3,title:"Inter-Block Football Cup",cat:"Sports",date:day(14),time:"16:00",venue:"Sports Ground",cap:60,desc:"Knockout football between hostel blocks."},
{id:4,title:"Web Development Workshop",cat:"Workshop",date:day(4),time:"11:00",venue:"Block 34 Lab",cap:40,desc:"Build your first responsive site."},
{id:5,title:"Placement Prep Talk",cat:"Career",date:day(-5),time:"14:00",venue:"Main Auditorium",cap:150,desc:"Resume and interview tips from alumni."}];
let S={events:seed,regs:[],next:100,tab:"events",q:"",fc:"",fs:"",mq:"",edit:null,favs:[],onlyFav:false};
let dark=false;
try{const r=localStorage.getItem("lpu-hub");if(r){const p=JSON.parse(r);if(p&&p.events)S={...S,...p}}}catch(e){}
const save=()=>{try{localStorage.setItem("lpu-hub",JSON.stringify({events:S.events,regs:S.regs,next:S.next}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>new Date(d+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
function toast(m,ok=true){const t=$("#toast");t.textContent=m;t.style.background=ok?"var(--ok)":"var(--er)";t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",3200)}
const taken=id=>S.regs.filter(r=>r.eid===id&&r.status==="Confirmed").length;
const evStatus=e=>e.date<today?"Completed":taken(e.id)>=e.cap?"Full":"Open";
function jump(t){const e=document.getElementById("sec-"+t);if(e)e.scrollIntoView({behavior:"smooth"})}
function go(t){S.edit=null;draw();jump(t)}
function draw(){
$("#nav").innerHTML=TABS.map(([k,label])=>`<button class="${S.tab===k?"on":""}" onclick="goTab('${k}')">${label}${k==="mine"&&S.regs.length?` <span class="tag">${S.regs.filter(r=>r.status!=="Cancelled").length}</span>`:""}</button>`).join("");
const y=scrollY;$("#main").innerHTML=[["events","<h2>Explore campus events</h2>"+vEvents()],["mine",vMine()],["org",vOrg()],["dash",vDash()]].map(([k,h])=>`<section id="sec-${k}" ${S.tab!==k?'class="subdued"':""}>${h}</section>`).join("");scrollTo(0,y);
}
function goTab(t){S.tab=t;draw();jump(t)}
function toggleTheme(){dark=!dark;document.documentElement.dataset.theme=dark?"dark":"light";toast(dark?"Dark mode enabled":"Light mode enabled")}
function toggleFav(id){S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];draw()}
function showDetails(id){const e=S.events.find(x=>x.id===id);const d=$("#dlg");d.innerHTML=`<h2>${esc(e.title)}</h2><p><span class="tag">${e.cat}</span><span class="tag ${evStatus(e)}">${evStatus(e)}</span></p><p class="mu">${fmt(e.date)} · ${e.time}<br>${esc(e.venue)}</p><p>${esc(e.desc)}</p><p><b>${Math.max(0,e.cap-taken(e.id))}</b> seats currently available</p><div class="row"><button class="btn" onclick="$('#dlg').close();openReg(${id})">Register now</button><button class="btn g" onclick="$('#dlg').close()">Close</button></div>`;d.showModal()}
function vEvents(){
const list=S.events.filter(e=>(!S.q||(e.title+e.venue+e.desc).toLowerCase().includes(S.q.toLowerCase()))&&(!S.fc||e.cat===S.fc)&&(!S.fs||evStatus(e)===S.fs)&&(!S.onlyFav||S.favs.includes(e.id))).sort((a,b)=>a.date.localeCompare(b.date));
return `<div class="bar"><input id="q" aria-label="Search events" placeholder="Search events, venues or keywords..." value="${esc(S.q)}" oninput="S.q=this.value;keep('q')">
<select aria-label="Filter by category" onchange="S.fc=this.value;draw()"><option value="">All categories</option>${CATS.map(c=>`<option ${S.fc===c?"selected":""}>${c}</option>`).join("")}</select>
<select aria-label="Filter by status" onchange="S.fs=this.value;draw()"><option value="">Any status</option>${["Open","Full","Completed"].map(c=>`<option ${S.fs===c?"selected":""}>${c}</option>`).join("")}</select>
<button class="btn g" onclick="S.onlyFav=!S.onlyFav;draw()">${S.onlyFav?"★ Showing saved":"☆ Saved events"}</button>
<button class="btn g" onclick="S.q='';S.fc='';S.fs='';S.onlyFav=false;draw()">Clear filters</button></div>
<div class="mu" style="margin:-5px 0 14px">${list.length} event${list.length===1?"":"s"} found · Select an event to view details or save it</div>
${list.length?`<div class="grid">${list.map(card).join("")}</div>`:`<div class="empty">No events match. Clear a filter or search for something else.</div>`}`}
function keep(id){const p=$("#"+id).selectionStart;draw();const q=$("#"+id);q.focus({preventScroll:true});q.setSelectionRange(p,p)}
function card(e){const t=taken(e.id),st=evStatus(e),pct=Math.min(100,Math.round(t/e.cap*100));
return `<div class="card eventcard"><div><span class="tag">${e.cat}</span><span class="tag ${st}">${st}</span></div>
<h3>${esc(e.title)}</h3><div class="mu">📅 ${fmt(e.date)} · ${e.time}<br>📍 ${esc(e.venue)}</div><div>${esc(e.desc)}</div>
<div class="meter"><i style="width:${pct}%"></i></div><div class="mu">${Math.max(0,e.cap-t)} of ${e.cap} seats left</div>
<div class="row"><button class="btn" ${st==="Completed"?"disabled":""} onclick="openReg(${e.id})">${st==="Full"?"Join waitlist":"Register"}</button><button class="btn g" onclick="showDetails(${e.id})">Details</button><button class="btn g" aria-label="Save event" onclick="toggleFav(${e.id})">${S.favs.includes(e.id)?"★ Saved":"☆ Save"}</button></div></div>`}
function openReg(id){const e=S.events.find(x=>x.id===id);const d=$("#dlg");
d.innerHTML=`<h2>${st(e)} ${esc(e.title)}</h2><div class="mu">${fmt(e.date)} at ${e.time}, ${esc(e.venue)}</div>
<label for="n">Full name</label><input id="n"><div class="err" id="en"></div>
<div class="two"><div><label for="r">Registration number</label><input id="r" inputmode="numeric" placeholder="8 digits"><div class="err" id="er"></div></div>
<div><label for="p">Program</label><select id="p">${PROGS.map(x=>`<option>${x}</option>`).join("")}</select></div></div>
<label for="m">University email</label><input id="m" placeholder="name@lpu.in"><div class="err" id="em"></div>
<label for="h">Phone</label><input id="h" inputmode="numeric" placeholder="10 digits"><div class="err" id="eh"></div>
<div class="row" style="margin-top:14px"><button class="btn" onclick="submitReg(${id})">${evStatus(e)==="Full"?"Join waitlist":"Confirm registration"}</button><button class="btn g" onclick="$('#dlg').close()">Cancel</button></div>`;
d.showModal()}
const st=e=>evStatus(e)==="Full"?"Waitlist for":"Register for";
function submitReg(id){
const v=k=>$("#"+k).value.trim(),er={};
if(v("n").length<3)er.n="Enter your full name (at least 3 letters).";
if(!/^\d{8}$/.test(v("r")))er.r="Registration number must be 8 digits.";
if(!/^[\w.+-]+@lpu\.in$/i.test(v("m")))er.m="Use your university email ending in @lpu.in.";
if(!/^[6-9]\d{9}$/.test(v("h")))er.h="Enter a valid 10-digit mobile number.";
if(S.regs.some(x=>x.eid===id&&x.reg===v("r")&&x.status!=="Cancelled"))er.r="This registration number is already registered for this event.";
["n","r","m","h"].forEach(k=>$("#e"+(k==="r"?"r":k)).textContent=er[k]||"");
if(Object.keys(er).length){toast("Fix the highlighted fields and try again.",false);return}
const e=S.events.find(x=>x.id===id);const status=evStatus(e)==="Full"?"Waitlisted":"Confirmed";
S.regs.push({id:S.next++,eid:id,name:v("n"),reg:v("r"),email:v("m"),phone:v("h"),prog:v("p"),status});save();$("#dlg").close();
toast(status==="Confirmed"?"Registered. Your seat is confirmed.":"Event is full. You are on the waitlist.");draw()}
function vMine(){
const q=S.mq.toLowerCase();const l=S.regs.filter(r=>!q||(r.reg+r.email+r.name).toLowerCase().includes(q));
return `<h2>My registrations</h2><div class="bar"><input id="q2" placeholder="Search by name, registration number or email" value="${esc(S.mq)}" oninput="S.mq=this.value;keep('q2')"></div>
${l.length?`<div class="grid">${l.map(r=>{const e=S.events.find(x=>x.id===r.eid);return `<div class="card"><div><span class="tag ${r.status}">${r.status}</span></div>
<h3>${esc(e?e.title:"Removed event")}</h3><div class="mu">${e?fmt(e.date)+" at "+e.time+", "+esc(e.venue):""}</div>
<div>${esc(r.name)} (${r.reg})<br><span class="mu">${esc(r.prog)}, ${esc(r.email)}</span></div>
<div class="row">${r.status!=="Cancelled"?`<button class="btn d" onclick="cancelReg(${r.id})">Cancel registration</button>`:""}</div></div>`}).join("")}</div>`:`<div class="empty">No registrations yet. Open the Events tab and register for one.</div>`}`}
function cancelReg(id){const r=S.regs.find(x=>x.id===id);if(!confirm("Cancel this registration?"))return;
const was=r.status;r.status="Cancelled";
if(was==="Confirmed"){const w=S.regs.find(x=>x.eid===r.eid&&x.status==="Waitlisted");if(w)w.status="Confirmed"}
save();toast("Registration cancelled.");draw()}
function vOrg(){const e=S.edit?S.events.find(x=>x.id===S.edit):null;const f=e||{title:"",cat:CATS[0],date:"",time:"",venue:VENUES[0],cap:"",desc:""};
return `<h2>${e?"Update event":"Add an event"}</h2><div class="card">
<label for="t">Title</label><input id="t" value="${esc(f.title)}"><div class="err" id="et"></div>
<div class="two"><div><label for="c">Category</label><select id="c">${CATS.map(c=>`<option ${f.cat===c?"selected":""}>${c}</option>`).join("")}</select></div>
<div><label for="v">Venue</label><select id="v">${VENUES.map(c=>`<option ${f.venue===c?"selected":""}>${c}</option>`).join("")}</select></div>
<div><label for="d">Date</label><input id="d" type="date" value="${f.date}"><div class="err" id="ed"></div></div>
<div><label for="tm">Time</label><input id="tm" type="time" value="${f.time}"><div class="err" id="etm"></div></div></div>
<label for="cp">Seats</label><input id="cp" type="number" min="1" value="${f.cap}"><div class="err" id="ecp"></div>
<label for="ds">Description</label><textarea id="ds" rows="3">${esc(f.desc)}</textarea>
<div class="row" style="margin-top:12px"><button class="btn" onclick="saveEvent()">${e?"Save changes":"Add event"}</button>${e?`<button class="btn g" onclick="go('org')">Cancel</button>`:""}</div></div>
<h2 style="margin-top:24px">All events</h2><div class="grid">${S.events.map(x=>`<div class="card"><h3>${esc(x.title)}</h3><div class="mu">${fmt(x.date)}, ${taken(x.id)}/${x.cap} seats filled</div>
<div class="row"><button class="btn g" onclick="S.edit=${x.id};draw();jump('org')">Edit</button><button class="btn d" onclick="delEvent(${x.id})">Delete</button></div></div>`).join("")}</div>`}
function saveEvent(){const v=k=>$("#"+k).value.trim(),er={};
if(v("t").length<3)er.t="Enter a title of at least 3 characters.";
if(!v("d"))er.d="Pick a date.";else if(v("d")<today&&!S.edit)er.d="Date cannot be in the past.";
if(!v("tm"))er.tm="Pick a start time.";
if(!(+v("cp")>=1))er.cp="Seats must be at least 1.";
["t","d","tm","cp"].forEach(k=>$("#e"+k).textContent=er[k]||"");
if(Object.keys(er).length){toast("Fix the highlighted fields and try again.",false);return}
const o={title:v("t"),cat:v("c"),venue:v("v"),date:v("d"),time:v("tm"),cap:+v("cp"),desc:v("ds")};
if(S.edit){Object.assign(S.events.find(x=>x.id===S.edit),o);toast("Event updated.")}else{S.events.push({id:S.next++,...o});toast("Event added.")}
S.edit=null;save();draw()}
function delEvent(id){if(!confirm("Delete this event and its registrations?"))return;
S.events=S.events.filter(x=>x.id!==id);S.regs=S.regs.filter(r=>r.eid!==id);save();toast("Event deleted.");draw()}
function vDash(){
const up=S.events.filter(e=>e.date>=today),conf=S.regs.filter(r=>r.status==="Confirmed").length,wl=S.regs.filter(r=>r.status==="Waitlisted").length;
const left=up.reduce((a,e)=>a+Math.max(0,e.cap-taken(e.id)),0);const mx=Math.max(1,...CATS.map(c=>S.regs.filter(r=>r.status!=="Cancelled"&&(S.events.find(e=>e.id===r.eid)||{}).cat===c).length));
return `<h2>Dashboard</h2><div class="stats">
<div class="card stat"><b>${S.events.length}</b>Total events</div><div class="card stat"><b>${up.length}</b>Upcoming</div>
<div class="card stat"><b>${conf}</b>Confirmed</div><div class="card stat"><b>${wl}</b>Waitlisted</div><div class="card stat"><b>${left}</b>Seats left</div></div>
<div class="card"><h3>Registrations by category</h3>${CATS.map(c=>{const n=S.regs.filter(r=>r.status!=="Cancelled"&&(S.events.find(e=>e.id===r.eid)||{}).cat===c).length;
return `<div class="brow"><span>${c}</span><div class="meter"><i style="width:${n/mx*100}%"></i></div><span>${n}</span></div>`}).join("")}</div>
<div class="card" style="margin-top:16px"><h3>Next events</h3>${up.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,4).map(e=>`<div>${esc(e.title)} <span class="mu">${fmt(e.date)}, ${evStatus(e)}</span></div>`).join("")||'<div class="mu">No upcoming events.</div>'}</div>`}
draw();
</script>
</body>
</html>
